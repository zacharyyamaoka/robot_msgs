[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robot-msgs"
version = "0.1.0"
description = "Standard robot message types as frozen Python dataclasses, with the helper functions ROS messages never had."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zach Yamaoka" }]
keywords = ["robotics", "ros", "messages", "trajectory", "geometry", "dataclasses"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.11"
# WHY numpy and the stdlib-only dataclass-values: every message stores its numbers in the most compact
# form (contiguous, read-only arrays) so batch views are free; Value/Space come from dataclass-values,
# the domain-free layer shared with py_dataclass_viewer (Zach, 2026-11-10). Everything heavier is an extra.
dependencies = ["numpy>=1.26", "dataclass-values"]

[project.urls]
Homepage = "https://robotmsgs.com"
Source = "https://github.com/zacharyyamaoka/robot_msgs"

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
ros = ["rosbags>=0.10"]
test = ["pytest>=8", "scipy>=1.11", "matplotlib>=3.8", "rosbags>=0.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/robot_msgs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
# WHY a path source: dataclass-values is not on PyPI yet, and robot_msgs cannot be published with this
# dependency until it is; PyPI builds ignore [tool.uv]. This is the local dev checkout.
dataclass-values = { path = "/home/bam/dataclass_values", editable = true }
