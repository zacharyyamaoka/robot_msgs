[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robot-msgs"
version = "0.2.0"
description = "Standard robot message types as frozen Python dataclasses, with the helper functions ROS messages never had."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zach Yamaoka" }]
keywords = ["robotics", "ros", "messages", "trajectory", "geometry", "dataclasses"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.11"
# WHY numpy and the stdlib-only dataclass-values: every message stores its numbers in the most compact
# form (contiguous, read-only arrays) so batch views are free; Value/Space come from dataclass-values,
# the domain-free layer shared with py_dataclass_viewer (Zach, 2026-11-10). Everything heavier is an extra.
dependencies = ["numpy>=1.26", "dataclass-values>=0.1.0"]

[project.urls]
Homepage = "https://robotmsgs.com"
Source = "https://github.com/zacharyyamaoka/robot_msgs"

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "imageio-ffmpeg>=0.5"]
ros = ["rosbags>=0.10"]
test = ["pytest>=8", "scipy>=1.11", "matplotlib>=3.8", "imageio-ffmpeg>=0.5", "rosbags>=0.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/robot_msgs"]

[tool.hatch.build.targets.sdist]
# WHY: the sdist is the Python package; robotmsgs.com's generator and reports stay in git only.
exclude = ["website", "reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

