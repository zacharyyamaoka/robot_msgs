name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # WHY: test_viz writes a real .mp4 through matplotlib's FFMpegWriter; the runner image has no ffmpeg.
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: uv run --isolated --python ${{ matrix.python }} --extra test python -m pytest -q
        env:
          MPLBACKEND: Agg
